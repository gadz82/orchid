name: Deploy orchid-website to GitHub Pages

# The website is a Next.js app built with `output: 'export'`. This workflow
# runs the static export (`next build` → `out/`) and uploads the result as the
# GitHub Pages artifact.
#
# IMPORTANT one-time setup on GitHub:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
# While the source is set to "Deploy from a branch", Pages runs Jekyll on the
# source tree and ignores any workflow artifact.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-flight production
# deployment if a newer commit arrives — let it finish, then deploy again.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Tells configure-pages this is a Next.js static export; it computes
          # the right base_path for project pages (e.g. /orchid).
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Build (next export + pagefind)
        env:
          # next.config.mjs reads process.env.BASE_PATH and applies it to both
          # basePath and assetPrefix. For gadz82/orchid this resolves to "/orchid".
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next build writes the static export to ./out/ at the repo root.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
