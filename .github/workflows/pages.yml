name: Deploy orchid-website to GitHub Pages

# The website is a Next.js app built with `output: 'export'`. This workflow
# runs the static export (`next build` → `out/`) and uploads the result as the
# GitHub Pages artifact.
#
# IMPORTANT one-time setup on GitHub:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"
# While the source is set to "Deploy from a branch", Pages runs Jekyll on the
# source tree and ignores any workflow artifact.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; do not cancel an in-flight production
# deployment if a newer commit arrives — let it finish, then deploy again.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # NOTE: actions/configure-pages is intentionally not used here.
      # On this repository it consistently fails with the cryptic
      #   "TypeError: error must be an instance of Error"
      # which masks an underlying error in the Pages REST API call
      # (private-repo plan limits / org policy / etc).
      #
      # Workaround: enable Pages manually once via
      #   Settings → Pages → Source = "GitHub Actions"
      # then hardcode BASE_PATH below. For gadz82/orchid the site is served at
      # https://gadz82.github.io/orchid/, so BASE_PATH is "/orchid".
      # If you ever rename the repo, update BASE_PATH accordingly.

      - name: Install dependencies
        run: npm ci

      - name: Build (next export + pagefind)
        env:
          BASE_PATH: /orchid
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # next build writes the static export to ./out/ at the repo root.
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
